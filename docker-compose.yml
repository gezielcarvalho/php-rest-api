version: "3.8"

services:
  web:
    build: .
    container_name: php-rest-api
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      - DATABASE_HOST=db
      - DATABASE_NAME=database_for_rest
      - DATABASE_USER=root
      - DATABASE_PASSWORD=root_password
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: php-rest-api-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: database_for_rest
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./database/migration.sql:/docker-entrypoint-initdb.d/migration.sql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: php-rest-api-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password
    depends_on:
      - db
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
